<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.title | escape }}">
  <style>
    :root { --ink:#172033; --muted:#5d6878; --line:#e3e8f0; --brand:#174ea6; --brand-soft:#eef4ff; --surface:#fff; --page:#f7f9fc; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--page); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.65; }
    a { color:var(--brand); }
    .site-header { background:#102a56; color:#fff; border-bottom:4px solid #6ea8fe; }
    .site-header-inner { max-width:1180px; margin:0 auto; padding:1rem 1.25rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
    .site-title { color:#fff; font-weight:750; text-decoration:none; letter-spacing:.01em; }
    .site-nav { display:flex; flex-wrap:wrap; gap:.35rem; }
    .site-nav a { color:#dce9ff; padding:.35rem .65rem; border-radius:6px; text-decoration:none; font-size:.92rem; }
    .site-nav a:hover, .site-nav a:focus { background:rgba(255,255,255,.14); color:#fff; }
    .page-shell { max-width:1180px; margin:0 auto; padding:2.25rem 1.25rem 4rem; }
    .content { max-width:920px; margin:0 auto; padding:2rem 2.25rem; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 28px rgba(24,45,80,.07); }
    .content h1 { margin-top:0; color:#102a56; line-height:1.2; font-size:clamp(1.8rem,3vw,2.6rem); }
    .content h2 { margin-top:2.3rem; padding-bottom:.35rem; border-bottom:1px solid var(--line); color:#173f91; line-height:1.3; }
    .content h3 { margin-top:1.7rem; color:#244d8f; }
    .content img { max-width:100%; height:auto; border-radius:8px; }
    .content table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.94rem; overflow:hidden; }
    .content th, .content td { border:1px solid var(--line); padding:.55rem .7rem; text-align:left; vertical-align:top; }
    .content th { background:var(--brand-soft); color:#173f91; }
    .content blockquote { margin:1.2rem 0; padding:.75rem 1rem; border-left:4px solid #6ea8fe; background:#f4f7fc; color:#334155; }
    .content pre { overflow:auto; padding:1rem; border-radius:8px; background:#172033; color:#f8fafc; font-size:.88rem; line-height:1.5; }
    .content code { padding:.12em .3em; border-radius:4px; background:#eef2f7; font-size:.9em; }
    .content pre code { padding:0; background:transparent; color:inherit; }
    .content li { margin:.3rem 0; }
    .content hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
    .site-footer { max-width:1180px; margin:0 auto; padding:0 1.25rem 2rem; color:var(--muted); font-size:.88rem; }
    @media (max-width:700px) { .site-header-inner { align-items:flex-start; flex-direction:column; } .page-shell { padding:1rem .75rem 2rem; } .content { padding:1.25rem; border-radius:10px; } .content table { display:block; overflow-x:auto; white-space:nowrap; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="{{ '/' | relative_url }}">Início</a>
        <a href="{{ '/' | relative_url }}#exercises">Exercícios</a>
        <a href="https://github.com/{{ site.github_username }}/mslearn-ai-agents">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="page-shell">
    <article class="content">
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">Exercícios de IA generativa em português · {{ site.author }}</footer>
</body>
</html>
